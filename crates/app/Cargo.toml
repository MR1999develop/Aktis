[package]
name = "app"
description = "The desktop window (egui): open, view, adjust, export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "aktis"
path = "src/main.rs"

[dependencies]
core-model.workspace = true
tool-api.workspace = true
commands.workspace = true
raw-io.workspace = true
engine.workspace = true
editor.workspace = true
platform.workspace = true
ai-models.workspace = true
catalog = { workspace = true, features = ["sqlite"] }
core-color.workspace = true
develop.workspace = true
tool-adjust.workspace = true
masks.workspace = true
# AI Select runs the segmentation models (ONNX Runtime, loaded at run time).
ai-segment.workspace = true
tagging.workspace = true
tagging-onnx.workspace = true
eframe = { version = "0.37.0", features = ["persistence"] }
rfd = "0.17.2"
serde = { version = "1.0.228", features = ["derive"] }

[dev-dependencies]
egui_kittest = { version = "0.37.0", features = ["eframe", "wgpu", "snapshot"] }

[lints]
workspace = true
