[package]
name = "raw-io"
description = "Reads camera RAW and DNG files into sensor data (rawler behind a narrow interface)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
core-model.workspace = true
# rawler does not follow SemVer yet: pinned exactly, upgraded deliberately.
rawler = "=0.8.0"
# The JPEG decoder rawler already uses, for the edited previews the catalog
# keeps and for JPEG pictures; TIFF for TIFF pictures.
image = { version = "0.25.10", default-features = false, features = ["jpeg", "tiff"] }

[dev-dependencies]
develop.workspace = true

[lints]
workspace = true
