[package]
name = "tagging-onnx"
description = "Image and text encoders for tagging, running SigLIP-family ONNX models locally with ONNX Runtime."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# GPU execution providers, off by default; the CPU always works.
# DirectML runs on any DirectX 12 GPU on Windows (AMD, Intel, NVIDIA).
directml = ["ort/directml"]
cuda = ["ort/cuda"]

[dependencies]
core-model.workspace = true
tagging.workspace = true
# ort is still a release candidate: pinned exactly, upgraded deliberately.
# download-binaries fetches a prebuilt ONNX Runtime at build time.
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-27"] }
# Only what is needed to read a tokenizer.json; no training, no downloads.
tokenizers = { version = "0.23", default-features = false, features = ["onig"] }

[lints]
workspace = true
