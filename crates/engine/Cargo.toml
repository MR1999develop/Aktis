[package]
name = "engine"
description = "What the window and the command line share: built-in tools, rendering on the GPU with CPU fallback, preview and display conversion, JPEG export."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
core-color.workspace = true
core-model.workspace = true
tool-api.workspace = true
render-cpu.workspace = true
masks.workspace = true
gpu.workspace = true
export.workspace = true
lens-db.workspace = true
platform.workspace = true
tool-exposure.workspace = true
tool-denoise-ai = { workspace = true, optional = true }

# On Windows the AI denoise tool also gets its GPU back ends: DirectML (any
# DirectX 12 card) and TensorRT for RTX (used when its DLLs are present).
[target.'cfg(windows)'.dependencies]
tool-denoise-ai = { workspace = true, optional = true, features = ["directml", "nvrtx"] }

[features]
default = ["ai-denoise"]
# The SCUNet neural-network denoiser (ONNX Runtime, downloaded at build time).
ai-denoise = ["dep:tool-denoise-ai"]

[dev-dependencies]
commands.workspace = true

[lints]
workspace = true
