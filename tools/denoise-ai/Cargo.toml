[package]
name = "tool-denoise-ai"
description = "AI denoise tool: the SCUNet neural network on ONNX Runtime (TensorRT for RTX, DirectML, CPU)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
authors.workspace = true

[features]
default = []
# GPU on Windows with any DirectX 12 card (NVIDIA, AMD, Intel); nothing to install.
directml = ["ort/directml"]
# TensorRT for RTX (RTX 30xx and later), FP16 with the `_fp16` models; needs
# the two TensorRT for RTX 1.4 DLLs next to the program, not CUDA or cuDNN.
nvrtx = ["ort/nvrtx"]

[dependencies]
core-model.workspace = true
core-color.workspace = true
tool-api.workspace = true
platform.workspace = true
onnx-env.workspace = true
# Loaded at run time through `onnx-env`, the one runtime of the process. The
# TensorRT for RTX provider needs an ONNX Runtime build that has it (1.31 with
# TensorRT for RTX 1.4); with another build the node uses DirectML or the CPU.
# Pinned exactly: upgraded deliberately.
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-22"] }

[lints]
workspace = true
