[workspace]
resolver = "3"
members = [
    "crates/core-model",
    "crates/core-color",
    "crates/tool-api",
    "crates/commands",
    "crates/develop",
    "crates/render-cpu",
    "crates/platform",
    "crates/raw-io",
    "crates/gpu",
    "crates/export",
    "crates/engine",
    "crates/editor",
    "crates/catalog",
    "crates/recipe-store",
    "crates/lens-db",
    "crates/masks",
    "crates/onnx-env",
    "crates/ai-models",
    "crates/ai-segment",
    "crates/cli",
    "crates/app",
    "crates/tagging",
    "crates/tagging-onnx",
    "crates/scunet-onnx",
    "tools/exposure",
    "tools/denoise-ai",
    "tools/adjust",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-3.0-only"
authors = ["MR"]

[workspace.dependencies]
core-model = { path = "crates/core-model" }
core-color = { path = "crates/core-color" }
tool-api = { path = "crates/tool-api" }
commands = { path = "crates/commands" }
develop = { path = "crates/develop" }
render-cpu = { path = "crates/render-cpu" }
platform = { path = "crates/platform" }
raw-io = { path = "crates/raw-io" }
gpu = { path = "crates/gpu" }
export = { path = "crates/export" }
engine = { path = "crates/engine" }
editor = { path = "crates/editor" }
recipe-store = { path = "crates/recipe-store" }
catalog = { path = "crates/catalog", default-features = false }
lens-db = { path = "crates/lens-db" }
tagging = { path = "crates/tagging" }
tagging-onnx = { path = "crates/tagging-onnx" }
masks = { path = "crates/masks" }
onnx-env = { path = "crates/onnx-env" }
ai-models = { path = "crates/ai-models" }
ai-segment = { path = "crates/ai-segment" }
scunet-onnx = { path = "crates/scunet-onnx" }
tool-exposure = { path = "tools/exposure" }
tool-denoise-ai = { path = "tools/denoise-ai" }
tool-adjust = { path = "tools/adjust" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
cast_possible_truncation = "warn"
cast_sign_loss = "warn"
float_cmp = "warn"
unwrap_used = "warn"
dbg_macro = "warn"
todo = "warn"

[profile.dev.package."*"]
opt-level = 3

[profile.profiling]
inherits = "release"
debug = true
