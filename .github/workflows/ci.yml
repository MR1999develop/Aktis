name: CI

on:
  push:
    branches-ignore: ['ci-results/**']
  pull_request:
  workflow_dispatch:

# Each job publishes its log (and any output files) to the branch
# ci-results/<branch>--<job>, so results can be read with git alone.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  # Adds new dependencies to Cargo.lock when a Cargo.toml changed (the cloud
  # workspace that writes the code cannot reach crates.io). Existing entries
  # are kept; nothing is upgraded. The other jobs build the updated lock.
  lockfile:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve new dependencies
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit Cargo.lock if it changed
        id: push
        run: |
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock is up to date"
          elif [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "::error::Cargo.lock is out of date; push to a branch to update it"
            exit 1
          else
            git config user.name "ci"
            git config user.email "ci@users.noreply.github.com"
            git commit -q -m "Update Cargo.lock for new dependencies" Cargo.lock
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.os }}
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.lockfile.outputs.sha }}
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - name: Toolchain
        run: mkdir -p ci-out && rustup show active-toolchain 2>&1 | tee ci-out/log.txt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check 2>&1 | tee -a ci-out/log.txt
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee -a ci-out/log.txt
      - name: Software Vulkan driver (Ubuntu), so the GPU tests run
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - name: Test
        run: cargo test --workspace --locked 2>&1 | tee -a ci-out/log.txt
        env:
          RNE_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Publish results
        if: always()
        run: |
          bash .github/scripts/publish-results.sh ${{ runner.os }} ${{ job.status }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A real RAW file end to end: decode, develop, render on the (software) GPU,
  # export. The JPEGs are published with the log so they can be looked at.
  real-raw:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.lockfile.outputs.sha }}
      - uses: Swatinem/rust-cache@v2
      - name: Software Vulkan driver
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - name: Sample RAW files
        # Nikon D3S frame from the ISS (NASA, public domain), from the rawpy test set.
        run: |
          mkdir -p ci-out
          curl -fsSL -o testdata/nikon-d3s.NEF https://raw.githubusercontent.com/letmaik/rawpy/main/test/iss030e122639.NEF
          ls -l testdata | tee ci-out/log.txt
      - name: Decode and develop every sample
        run: cargo test -p raw-io --release --locked -- --ignored --nocapture 2>&1 | tee -a ci-out/log.txt
      - name: rne gpu / info / develop
        run: |
          {
            cargo run -q --release --locked -p cli -- gpu
            cargo run -q --release --locked -p cli -- info testdata/nikon-d3s.NEF
            cargo run -q --release --locked -p cli -- develop testdata/nikon-d3s.NEF --exposure 0.5 -o ci-out/nikon-d3s.jpg
            cargo run -q --release --locked -p cli -- develop testdata/nikon-d3s.NEF --cpu -o ci-out/nikon-d3s-cpu.jpg
          } 2>&1 | tee -a ci-out/log.txt
      - name: Screenshot of the window with the sample open
        run: cargo test -p app --release --locked --test screenshot -- --ignored --nocapture 2>&1 | tee -a ci-out/log.txt
        env:
          RNE_SCREENSHOT_DIR: ci-out
      - name: Publish results
        if: always()
        run: bash .github/scripts/publish-results.sh real-raw ${{ job.status }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # AI tagging end to end with the real model: SigLIP 2 from Hugging Face,
  # sample photos (OpenCV test images and the NASA NEF), Italian keywords.
  tagging-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Model
        run: |
          mkdir -p ci-out
          {
            python3 .github/scripts/siglip_head.py google/siglip2-base-patch16-224
            curl -fsSL https://huggingface.co/api/models/onnx-community/siglip2-base-patch16-224-ONNX \
              | python3 -c "import json,sys; [print(s['rfilename']) for s in json.load(sys.stdin)['siblings']]"
            mkdir -p models/siglip2
            base=https://huggingface.co/onnx-community/siglip2-base-patch16-224-ONNX/resolve/main
            for f in onnx/vision_model.onnx onnx/text_model.onnx onnx/vision_model_quantized.onnx onnx/text_model_quantized.onnx tokenizer.json; do
              curl -fsSL -o "models/siglip2/$(basename "$f")" "$base/$f" || echo "missing $f"
            done
            ls -l models/siglip2
          } 2>&1 | tee -a ci-out/log.txt
      - name: Sample images
        run: |
          mkdir -p testdata/tag
          for f in fruits baboon butterfly building castle HappyFish aero3 orange; do
            curl -fsSL --retry 3 -o "testdata/tag/$f.jpg" "https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/$f.jpg" \
              || { echo "missing sample $f"; rm -f "testdata/tag/$f.jpg"; }
          done
          curl -fsSL --retry 3 -o testdata/tag/nikon-d3s.NEF https://raw.githubusercontent.com/letmaik/rawpy/main/test/iss030e122639.NEF \
            || echo "missing sample NEF"
          ls -l testdata/tag | tee -a ci-out/log.txt
      - name: rne tag
        run: |
          cargo build -q --release --locked -p cli 2>&1 | tee -a ci-out/log.txt
          rne=target/release/rne
          kw=crates/tagging/testdata/keywords-it.txt
          {
            echo "== template {} =="
            $rne tag testdata/tag/* --model models/siglip2 --keywords $kw | tee tags.txt
            echo "== template 'una foto di {}' =="
            $rne tag testdata/tag/* --model models/siglip2 --keywords $kw --template "una foto di {}"
            echo "== quantized, template 'una foto di {}' =="
            $rne tag testdata/tag/* --model models/siglip2 --keywords $kw --template "una foto di {}" --quantized
            echo "== search =="
            $rne tag testdata/tag/*.jpg --model models/siglip2 --search "un animale con il muso colorato"
            $rne tag testdata/tag/* --model models/siglip2 --search "la Terra fotografata dallo spazio"
          } 2>&1 | tee -a ci-out/log.txt
      - name: Expected keywords
        # The first suggestion of each sample must name what it shows.
        run: |
          python3 - <<'PY' 2>&1 | tee -a ci-out/log.txt
          import sys
          expected = {"HappyFish": "Pesce", "baboon": "Scimmia", "building": "Edificio", "butterfly": "Farfalla",
                      "fruits": "Frutta", "orange": "Arancia"}
          lines = open("tags.txt").read().splitlines()
          bad = []
          for i, line in enumerate(lines):
              for name, kw in expected.items():
                  if line.endswith(f"/{name}.jpg"):
                      first = lines[i + 1] if i + 1 < len(lines) else ""
                      ok = kw in first
                      print(f"{'ok  ' if ok else 'FAIL'} {name}: {first.strip()}")
                      if not ok:
                          bad.append(name)
          sys.exit(1 if bad else 0)
          PY
      - name: Publish results
        if: always()
        run: bash .github/scripts/publish-results.sh tagging-model ${{ job.status }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS is prepared but not shipped in version 1: keep it compiling.
  macos-check:
    needs: lockfile
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.lockfile.outputs.sha }}
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p ci-out && cargo check --workspace --all-targets --locked 2>&1 | tee ci-out/log.txt
      - name: Publish results
        if: always()
        run: bash .github/scripts/publish-results.sh macOS ${{ job.status }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
