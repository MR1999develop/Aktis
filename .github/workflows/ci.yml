name: CI

# Manual only for now: development is checked on the developer's PC with
# scripts/check.bat, and GitHub Actions minutes are limited. Start a run from
# the Actions tab (or `gh workflow run CI --ref <branch>`).
on:
  workflow_dispatch:

# Each job publishes its log (and any output files) to the branch
# ci-results/<branch>--<job>, so results can be read with git alone.
permissions:
  contents: write

env:
  CARGO_TERM_COLOR: never

defaults:
  run:
    shell: bash

jobs:
  # Adds new dependencies to Cargo.lock when a Cargo.toml changed (the cloud
  # workspace that writes the code cannot reach crates.io). Existing entries
  # are kept; nothing is upgraded. The other jobs build the updated lock.
  lockfile:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
      - name: Resolve new dependencies
        run: cargo metadata --format-version 1 > /dev/null
      - name: Commit Cargo.lock if it changed
        id: push
        run: |
          if git diff --quiet Cargo.lock; then
            echo "Cargo.lock is up to date"
          elif [ "$GITHUB_EVENT_NAME" != "push" ]; then
            echo "::error::Cargo.lock is out of date; push to a branch to update it"
            exit 1
          else
            git config user.name "ci"
            git config user.email "ci@users.noreply.github.com"
            git commit -q -m "Update Cargo.lock for new dependencies" Cargo.lock
            git push -q origin "HEAD:${GITHUB_REF_NAME}"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    name: ${{ matrix.os }}
    needs: lockfile
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.lockfile.outputs.sha }}
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - name: Toolchain
        run: mkdir -p ci-out && rustup show active-toolchain 2>&1 | tee ci-out/log.txt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check 2>&1 | tee -a ci-out/log.txt
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee -a ci-out/log.txt
      - name: Software Vulkan driver (Ubuntu), so the GPU tests run
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - name: Test
        run: cargo test --workspace --locked 2>&1 | tee -a ci-out/log.txt
        env:
          AKTIS_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Publish results
        if: always()
        run: |
          bash .github/scripts/publish-results.sh ${{ runner.os }} ${{ job.status }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A real RAW file end to end: decode, develop, render on the (software) GPU,
  # export. The JPEGs are published with the log so they can be looked at.
  real-raw:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.lockfile.outputs.sha }}
      - uses: Swatinem/rust-cache@v2
      - name: Software Vulkan driver
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - name: Sample RAW files
        # Nikon D3S frame from the ISS (NASA, public domain), from the rawpy test set.
        run: |
          mkdir -p ci-out
          curl -fsSL -o testdata/nikon-d3s.NEF https://raw.githubusercontent.com/letmaik/rawpy/main/test/iss030e122639.NEF
          ls -l testdata | tee ci-out/log.txt
      - name: Decode and develop every sample
        run: cargo test -p raw-io --release --locked -- --ignored --nocapture 2>&1 | tee -a ci-out/log.txt
      - name: aktis-cli gpu / info / develop
        run: |
          {
            cargo run -q --release --locked -p cli -- gpu
            cargo run -q --release --locked -p cli -- info testdata/nikon-d3s.NEF
            cargo run -q --release --locked -p cli -- lenses nikkor 24-70
            cargo run -q --release --locked -p cli -- develop testdata/nikon-d3s.NEF --exposure 0.5 -o ci-out/nikon-d3s.jpg
            cargo run -q --release --locked -p cli -- develop testdata/nikon-d3s.NEF --cpu -o ci-out/nikon-d3s-cpu.jpg
            cargo run -q --release --locked -p cli -- develop testdata/nikon-d3s.NEF --no-lens -o ci-out/nikon-d3s-no-lens.jpg
          } 2>&1 | tee -a ci-out/log.txt
      - name: Screenshot of the window with the sample open
        run: cargo test -p app --release --locked --test screenshot -- --ignored --nocapture 2>&1 | tee -a ci-out/log.txt
        env:
          # Tests run in the crate's folder: give an absolute path.
          AKTIS_SCREENSHOT_DIR: ${{ github.workspace }}/ci-out
      - name: Publish results
        if: always()
        run: bash .github/scripts/publish-results.sh real-raw ${{ job.status }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # AI tagging end to end with the real model: SigLIP 2 from Hugging Face,
  # sample photos (OpenCV test images and the NASA NEF), Italian keywords.
  tagging-model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: Swatinem/rust-cache@v2
      - name: Model
        run: |
          mkdir -p ci-out
          {
            python3 .github/scripts/siglip_head.py google/siglip2-base-patch16-224
            curl -fsSL https://huggingface.co/api/models/onnx-community/siglip2-base-patch16-224-ONNX \
              | python3 -c "import json,sys; [print(s['rfilename']) for s in json.load(sys.stdin)['siblings']]"
            mkdir -p models/siglip2
            base=https://huggingface.co/onnx-community/siglip2-base-patch16-224-ONNX/resolve/main
            for f in onnx/vision_model.onnx onnx/text_model.onnx onnx/vision_model_quantized.onnx onnx/text_model_quantized.onnx tokenizer.json; do
              curl -fsSL -o "models/siglip2/$(basename "$f")" "$base/$f" || echo "missing $f"
            done
            ls -l models/siglip2
          } 2>&1 | tee -a ci-out/log.txt
      - name: Sample images
        run: |
          mkdir -p testdata/tag
          for f in fruits baboon butterfly building castle HappyFish aero3 orange; do
            curl -fsSL --retry 3 -o "testdata/tag/$f.jpg" "https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/$f.jpg" \
              || { echo "missing sample $f"; rm -f "testdata/tag/$f.jpg"; }
          done
          curl -fsSL --retry 3 -o testdata/tag/nikon-d3s.NEF https://raw.githubusercontent.com/letmaik/rawpy/main/test/iss030e122639.NEF \
            || echo "missing sample NEF"
          ls -l testdata/tag | tee -a ci-out/log.txt
      - name: aktis-cli tag
        run: |
          cargo build -q --release --locked -p cli 2>&1 | tee -a ci-out/log.txt
          cli=target/release/aktis-cli
          kw=crates/tagging/testdata/keywords-it.txt
          {
            echo "== template {} =="
            $cli tag testdata/tag/* --model models/siglip2 --keywords $kw | tee tags.txt
            echo "== template 'una foto di {}' =="
            $cli tag testdata/tag/* --model models/siglip2 --keywords $kw --template "una foto di {}"
            echo "== quantized, template 'una foto di {}' =="
            $cli tag testdata/tag/* --model models/siglip2 --keywords $kw --template "una foto di {}" --quantized
            echo "== search =="
            $cli tag testdata/tag/*.jpg --model models/siglip2 --search "un animale con il muso colorato"
            $cli tag testdata/tag/* --model models/siglip2 --search "la Terra fotografata dallo spazio"
          } 2>&1 | tee -a ci-out/log.txt
      - name: Expected keywords
        # The first suggestion of each sample must name what it shows.
        run: |
          python3 - <<'PY' 2>&1 | tee -a ci-out/log.txt
          import sys
          expected = {"HappyFish": "Pesce", "baboon": "Scimmia", "building": "Edificio", "butterfly": "Farfalla",
                      "fruits": "Frutta", "orange": "Arancia"}
          lines = open("tags.txt").read().splitlines()
          bad = []
          for i, line in enumerate(lines):
              for name, kw in expected.items():
                  if line.endswith(f"/{name}.jpg"):
                      first = lines[i + 1] if i + 1 < len(lines) else ""
                      ok = kw in first
                      print(f"{'ok  ' if ok else 'FAIL'} {name}: {first.strip()}")
                      if not ok:
                          bad.append(name)
          sys.exit(1 if bad else 0)
          PY
      - name: Publish results
        if: always()
        run: bash .github/scripts/publish-results.sh tagging-model ${{ job.status }}

  # The AI denoise node with the real network: the SCUNet model is generated
  # from the original KAIR weights (Python + NumPy), then the network runs on
  # the CPU in the tool's own test and on a real RAW file. The JPEGs with and
  # without the node are published with the log.
  ai-denoise:
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.lockfile.outputs.sha }}
      - uses: Swatinem/rust-cache@v2
      - name: SCUNet model (448 px tiles)
        run: |
          mkdir -p ci-out
          python3 -m pip install -q numpy onnxruntime
          curl -fsSL -o scunet_color_real_psnr.pth https://github.com/cszn/KAIR/releases/download/v1.0/scunet_color_real_psnr.pth
          python3 scripts/scunet/export_onnx_model.py --weights scunet_color_real_psnr.pth \
              --output models/scunet_color_real_448.onnx --verify 2>&1 | tee ci-out/log.txt
      - name: The network removes the noise (tool test)
        run: cargo test -p tool-denoise-ai --release --locked -- --ignored --nocapture 2>&1 | tee -a ci-out/log.txt
        env:
          AKTIS_DENOISE_MODELS: ${{ github.workspace }}/models
          AKTIS_DENOISE_DEVICE: cpu
      - name: Software Vulkan driver
        run: sudo apt-get update -q && sudo apt-get install -y -q mesa-vulkan-drivers
      - name: aktis-cli develop --denoise on a real RAW file
        run: |
          curl -fsSL -o testdata/nikon-d3s.NEF https://raw.githubusercontent.com/letmaik/rawpy/main/test/iss030e122639.NEF
          {
            cargo run -q --release --locked -p cli -- develop testdata/nikon-d3s.NEF --exposure 0.5 -o ci-out/nikon-d3s.jpg
            cargo run -q --release --locked -p cli -- develop testdata/nikon-d3s.NEF --exposure 0.5 --denoise 80 -o ci-out/nikon-d3s-denoise.jpg
          } 2>&1 | tee -a ci-out/log.txt
        env:
          AKTIS_DENOISE_DEVICE: cpu
      - name: Publish results
        if: always()
        run: bash .github/scripts/publish-results.sh ai-denoise ${{ job.status }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # macOS is prepared but not shipped in version 1: keep it compiling.
  macos-check:
    needs: lockfile
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.lockfile.outputs.sha }}
      - uses: Swatinem/rust-cache@v2
      - run: mkdir -p ci-out && cargo check --workspace --all-targets --locked 2>&1 | tee ci-out/log.txt
      - name: Publish results
        if: always()
        run: bash .github/scripts/publish-results.sh macOS ${{ job.status }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # AI selection end to end with the real models on the CPU build of ONNX
  # Runtime: subject, people, a click, a box and a detected class, on a RAW
  # file and on public test photos. The previews (selection in red) are
  # published with the log so the masks can be looked at.
  ai-masks:
    needs: lockfile
    runs-on: ubuntu-latest
    env:
      ORT_VERSION: 1.24.1
      AKTIS_MODELS_DIR: ${{ github.workspace }}/models
      AKTIS_DATA_DIR: ${{ github.workspace }}/aktis-data
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.lockfile.outputs.sha }}
      - uses: Swatinem/rust-cache@v2
      - name: Model cache
        uses: actions/cache@v4
        with:
          path: models
          key: ai-models-v1
      - name: ONNX Runtime (CPU)
        run: |
          mkdir -p ci-out ort
          curl -fsSL "https://github.com/microsoft/onnxruntime/releases/download/v$ORT_VERSION/onnxruntime-linux-x64-$ORT_VERSION.tgz" \
            | tar -xz -C ort --strip-components=1
          echo "ORT_DYLIB_PATH=$PWD/ort/lib/libonnxruntime.so" >> "$GITHUB_ENV"
      - name: Build
        run: cargo build -q --release --locked -p cli 2>&1 | tee ci-out/log.txt
      - name: Models (download what the catalog lists, then verify the checksums)
        run: |
          mkdir -p models
          for url in $(target/release/aktis-cli models | grep -o 'https://[^ ]*\.onnx'); do
            curl -fsSL -o "models/$(basename "$url")" "$url"
          done
          target/release/aktis-cli models --verify 2>&1 | tee -a ci-out/log.txt
      - name: Test photos
        # Public test images of OpenCV, Segment Anything and YOLOX (not committed).
        run: |
          { sudo apt-get update -q && sudo apt-get install -y -q netpbm; } > /dev/null 2>> ci-out/log.txt
          curl -fsSL -o testdata/nikon-d3s.NEF https://raw.githubusercontent.com/letmaik/rawpy/main/test/iss030e122639.NEF
          get() {
            curl -fsSL -o "testdata/$1.jpg" "$2" || { echo "download failed: $2" | tee -a ci-out/log.txt; exit 1; }
            jpegtopnm "testdata/$1.jpg" > "testdata/$1.ppm" 2>> ci-out/log.txt
          }
          get people https://raw.githubusercontent.com/opencv/opencv/4.x/samples/data/messi5.jpg
          get truck https://raw.githubusercontent.com/facebookresearch/segment-anything/main/notebooks/images/truck.jpg
          get dog https://raw.githubusercontent.com/Megvii-BaseDetection/YOLOX/main/assets/dog.jpg
          ls -l testdata | tee -a ci-out/log.txt
      - name: aktis-cli mask / develop with a selection
        run: |
          cli() {
            echo "\$ aktis-cli $*"
            if ! target/release/aktis-cli "$@"; then echo "FAILED: aktis-cli $*"; touch ci-out/FAILED; fi
            echo
          }
          {
            cli mask testdata/people.ppm --people -o ci-out/people-people.jpg
            cli mask testdata/people.ppm --subject -o ci-out/people-subject.jpg --mask-out ci-out/people-subject-mask.jpg
            cli mask testdata/truck.ppm --point 0.278,0.3125 -o ci-out/truck-click.jpg
            cli mask testdata/truck.ppm --box 0.236,0.5,0.389,0.729 -o ci-out/truck-box.jpg
            cli mask testdata/truck.ppm --subject --invert --feather 1 -o ci-out/truck-background.jpg
            cli mask testdata/dog.ppm --detect dog --detect bicycle -o ci-out/dog-detect.jpg
            cli mask testdata/nikon-d3s.NEF --subject -o ci-out/nef-subject.jpg
            cli develop testdata/nikon-d3s.NEF --exposure 1.5 --subject -o ci-out/nef-subject-plus-1.5.jpg
          } 2>&1 | tee -a ci-out/log.txt
          test ! -e ci-out/FAILED
      - name: Publish results
        if: always()
        run: bash .github/scripts/publish-results.sh ai-masks ${{ job.status }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
