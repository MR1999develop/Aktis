name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler; rustup installs it on first use.
      - name: Toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Software Vulkan driver (Ubuntu), so the GPU tests run
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers
      - name: Test
        run: cargo test --workspace
        env:
          RNE_REQUIRE_GPU: ${{ runner.os == 'Linux' && '1' || '' }}
      - name: Upload the resolved Cargo.lock
        if: runner.os == 'Linux' && always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock

  # macOS is prepared but not shipped in version 1: keep it compiling.
  macos-check:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --all-targets
