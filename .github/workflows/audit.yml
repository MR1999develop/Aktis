name: Audit

# Every day: the dependencies in Cargo.lock against the RustSec advisories
# (a vulnerability published today fails tomorrow's run, even with no new
# commit), plus licences and sources (deny.toml). About a minute; also from
# the Actions tab.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions pinned to the commit of a release (the tag in the comment).
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories bans licenses sources
          arguments: --all-features --locked
