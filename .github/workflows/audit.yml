name: Audit

# Every day: the dependencies in Cargo.lock against the RustSec advisories
# (a vulnerability published today fails tomorrow's run, even with no new
# commit), plus licences and sources (deny.toml). About a minute; also from
# the Actions tab.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions pinned to the commit of a release (the tag in the comment).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The repository allows only GitHub's own actions: cargo-deny comes from
      # its release, checked against the SHA-256 the release publishes.
      - name: cargo-deny 0.20.2
        run: |
          name=cargo-deny-0.20.2-x86_64-unknown-linux-musl
          curl -fsSL --proto =https -o deny.tgz             "https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/$name.tar.gz"
          echo "9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  deny.tgz" | sha256sum -c -
          tar -xzf deny.tgz
          install -m 755 "$name/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
      - name: Check advisories, bans, licences and sources
        run: cargo deny --all-features --locked check advisories bans licenses sources
